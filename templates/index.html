<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header Bar (10% of viewport height) -->
    <header class="header-bar">
        <div class="container-fluid h-100">
            <div class="row h-100 align-items-center">
                <div class="col-12 d-flex flex-column justify-content-center text-start">
                    <h5 class="header-title">
                        {{ title }}
                    </h5>
                    <div class="status-counters">
                        <span class="counter-item">
                            <span class="counter-dot reports"></span>
                            <span class="counter-text"><span id="reports-count" class="counter-number">0</span> Reports</span>
                        </span>
                        <span class="counter-item">
                            <span class="counter-dot confirmations"></span>
                            <span class="counter-text"><span id="confirmations-count" class="counter-number">0</span> Working on it</span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Map Container (90% of viewport height) -->
    <div id="map-container">
        <div id="map" class="h-100"></div>
        
        <!-- Map Crosshair -->
        <div class="map-crosshair">
            <div class="crosshair-horizontal"></div>
            <div class="crosshair-vertical"></div>
        </div>
        <!-- Button Container -->
        <div class="button-container">
            <!-- Working on it Button -->
            <button id="workingOnItBtn" class="working-on-it-btn">
                <div class="info-icon"></div>
                <span>Working on it</span>
            </button>
            <!-- Report Outage Button -->
            <button id="reportOutageBtn" class="report-outage-btn">
                <div class="warning-icon"></div>
                <span>Report an Outage</span>
            </button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading outage data...</p>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Pass server data to JavaScript
        window.mapConfig = {
            centerLat: {{ center_lat }},
            centerLng: {{ center_lng }},
            zoom: {{ zoom }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
